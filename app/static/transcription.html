<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" type="image/jpeg" href="/static/assets/logo.jpg">
  <title>Transcription | Zingsa Files Center</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
<main class="shell">
  <header class="brand-card">
    <div class="brand-lockup">
      <img class="brand-logo" src="/static/assets/logo.jpg" alt="ZINGSA logo">
      <div>
        <div class="brand-name">Zingsa Files Center</div>
        <div class="brand-subtitle">Meeting transcription</div>
      </div>
    </div>
    <nav>
      <a href="/home">Home</a>
      <a href="/transcription" class="nav-active">Transcription</a>
      <a href="/documents">Documents</a>
      <span id="userName" class="user-name"></span>
      <button id="logout" class="quiet">Sign out</button>
    </nav>
  </header>

  <section class="panel upload">
    <div class="drop" id="drop">
      <strong>Drop an audio or video recording here</strong>
      <span>MP3, WAV, M4A, MP4, MKV, OGG, FLAC, WEBM</span>
      <input id="file" type="file" accept=".mp3,.wav,.m4a,.mp4,.mkv,.ogg,.flac,.webm">
    </div>
    <div class="options">
      <label>Model
        <select id="model">
          <option value="auto">Auto (queue policy)</option>
          <option value="large-v3">Force large-v3</option>
          <option value="medium">Force medium</option>
        </select>
      </label>
      <label>Language
        <select id="language">
          <option value="auto">Auto-detect</option>
          <option value="en">English</option>
        </select>
      </label>
      <label class="wide-field">Initial prompt
        <input id="prompt" placeholder="Names, terminology, case numbers">
      </label>
      <label class="wide-field">Formats
        <input id="formats" value="txt,txt_timestamps,srt,vtt,docx,json">
      </label>
      <button id="upload">Add to queue</button>
    </div>
    <p id="uploadError" class="error"></p>
  </section>

  <section class="section-head">
    <div>
      <p class="eyebrow">FIFO WORKER</p>
      <h2>Jobs</h2>
    </div>
    <button id="refresh" class="quiet">Refresh</button>
  </section>
  <section id="jobs" class="jobs"></section>
</main>
<script src="/static/transcription.js"></script>
</body>
</html>
