<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Administration | Zingsa Files Center</title><link rel="stylesheet" href="/static/style.css"></head>
<body><main class="shell"><header class="brand-card"><div><div class="brand-name">Zingsa Files Center</div><div class="brand-subtitle">Administration</div></div><button id="logout" class="quiet">Sign out</button></header><section class="section-head"><div><p class="eyebrow">PLATFORM OVERVIEW</p><h1>Administration</h1></div></section><section id="stats" class="stats"></section><section class="admin-grid"><section class="panel"><p class="eyebrow">NEW ACCOUNT</p><h2>Create account</h2><form id="createUserForm" class="admin-form"><label>Username<input name="username" required></label><label>Password<input name="password" type="password" required></label><label>Role<select name="role"><option value="user">User</option><option value="admin">Admin</option></select></label><button>Create account</button><p id="userError" class="error"></p></form></section><section class="panel"><p class="eyebrow">ACCESS CONTROL</p><h2>Accounts</h2><div class="table-wrap"><table><thead><tr><th>Username</th><th>Role</th><th>Status</th><th>Created</th><th>Created by</th><th>Actions</th></tr></thead><tbody id="users"></tbody></table></div></section></section><section class="panel audit-panel"><div class="audit-heading"><div><p class="eyebrow">SECURITY RECORD</p><h2>Audit log</h2></div><span class="read-only">Read only</span></div><div class="audit-filters"><label>Actor<select id="auditActor"><option value="">All actors</option></select></label><label>Action<select id="auditAction"><option value="">All actions</option></select></label></div><div class="table-wrap"><table><thead><tr><th>Timestamp</th><th>Actor</th><th>Action</th><th>Target</th><th>Details</th></tr></thead><tbody id="auditLog"></tbody></table></div><div class="audit-more"><button id="loadMoreAudit" class="quiet" hidden>Load more</button></div></section><dialog id="resetPasswordDialog"><form id="resetPasswordForm" method="dialog"><p class="eyebrow">ACCOUNT SECURITY</p><h2>Reset password</h2><p id="resetPasswordUser" class="meta"></p><label>New password<input name="new_password" type="password" minlength="8" autocomplete="new-password" required></label><p id="resetPasswordError" class="error"></p><div class="dialog-actions"><button type="button" id="cancelReset" class="quiet">Cancel</button><button type="submit">Save new password</button></div></form></dialog></main><script src="/static/admin.js?v=2"></script></body></html>
