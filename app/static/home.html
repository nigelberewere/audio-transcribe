<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" type="image/jpeg" href="/static/assets/logo.jpg">
  <title>Home | Zingsa Files Center</title>
  <link rel="stylesheet" href="/static/style.css?v=6">
</head>
<body>
<main class="shell">
  <header class="brand-card">
    <div class="brand-lockup">
      <img class="brand-logo" src="/static/assets/logo.jpg" alt="ZINGSA logo">
      <div>
        <div class="brand-name">Zingsa Files Center</div>
        <div class="brand-subtitle">Digital workspace</div>
      </div>
    </div>
    <div class="header-search">
      <div class="search-input-wrapper">
        <svg class="search-icon" viewBox="0 0 24 24" width="16" height="16" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
        <input type="search" id="globalSearch" placeholder="Search files & transcripts..." autocomplete="off">
        <button id="clearSearch" class="search-clear-btn" type="button" aria-label="Clear search" hidden>&times;</button>
      </div>
      <div id="searchResults" class="search-results-dropdown" hidden></div>
    </div>
    <nav>
      <a href="/home" class="nav-active">Home</a>
      <a href="/transcription">Transcription</a>
      <a href="/documents">Documents</a>
      <span id="userName" class="user-name"></span>
      <button id="logout" class="quiet">Sign out</button>
    </nav>
  </header>

  <section class="section-head">
    <div>
      <p class="eyebrow">DIGITAL WORKSPACE</p>
      <h1>Workspace Modules</h1>
      <p class="meta">Select an application module to begin your workflow.</p>
    </div>
  </section>

  <section id="modulesGrid" class="modules-grid"></section>

  <footer class="page-footer">
    Zingsa Files Center &middot; Internal use only
  </footer>
</main>
<script src="/static/home.js"></script>
<script src="/static/search.js"></script>
</body>
</html>
