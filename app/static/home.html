<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" type="image/jpeg" href="/static/assets/logo.jpg">
  <title>Home | Zingsa Files Center</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
<main class="shell">
  <header class="brand-card">
    <div class="brand-lockup">
      <img class="brand-logo" src="/static/assets/logo.jpg" alt="ZINGSA logo">
      <div>
        <div class="brand-name">Zingsa Files Center</div>
        <div class="brand-subtitle">Digital workspace</div>
      </div>
    </div>
    <nav>
      <a href="/home" class="nav-active">Home</a>
      <a href="/transcription">Transcription</a>
      <a href="/documents">Documents</a>
      <span id="userName" class="user-name"></span>
      <button id="logout" class="quiet">Sign out</button>
    </nav>
  </header>

  <section class="section-head">
    <div>
      <p class="eyebrow">DIGITAL WORKSPACE</p>
      <h1>Workspace Modules</h1>
      <p class="meta">Select an application module to begin your workflow.</p>
    </div>
  </section>

  <section id="modulesGrid" class="modules-grid"></section>

  <footer class="page-footer">
    Zingsa Files Center &middot; Internal use only
  </footer>
</main>
<script src="/static/home.js"></script>
</body>
</html>
